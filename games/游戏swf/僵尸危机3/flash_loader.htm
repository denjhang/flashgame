<style type='text/css'>
html, body {
	margin: 0px;
	padding: 0px;
	border: 0px;
	background-color: #444;
}
#flashmovie {
	width: 100%;
	height: 100%;
	position: absolute;
	margin: auto;
	top: 0;
	left: 0;
	bottom: 0;
	right: 0;
}
</style>
<script type='text/javascript'>
var w = 320;
var h = 240;
var full=true;
function zoomIn() {
	var view=document.getElementById('flashmovie');
	w = w + w *0.1;
	h = h + h *0.1;
	var xw = w +"px";
	var xh = h +"px";
	view.style.width = xw;
	view.style.height = xh;
	full = false;
	}
function zoomOut() {
	var view=document.getElementById('flashmovie');
	w = w - w *0.1;
	h = h - h *0.1;	
	var xw = w +"px";
	var xh = h +"px";
	view.style.width = xw;
	view.style.height = xh;
	full = false;
	}
function fullScreen(){
	var view=document.getElementById('flashmovie');
	if(full){
	w = 320;
	h =240;
	var xw = w +"px";
	var xh = h +"px";
	view.style.width = xw;
	view.style.height = xh; 
	full = false;
	}else{
	var xw = 100 +"%";
	var xh = 100 +"%";
	view.style.width = xw;
	view.style.height = xh; 
	full = true;
	}
}
function refocus(){
	var flashmovie=document.getElementById('flashmovie');
	setTimeout(function(){
		flashmovie.blur();
		flashmovie.focus();
		},0);
	}
</script>
