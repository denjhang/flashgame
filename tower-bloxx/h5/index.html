<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Tower Bloxx 3D — H5 (原版 J2ME 资产)</title>
<style>
  html,body{margin:0;height:100%;background:#20222e;display:flex;align-items:center;justify-content:center;font-family:"Segoe UI",sans-serif;}
  #stage{position:relative;width:640px;height:480px;box-shadow:0 0 40px #000;}
  canvas{display:block;}
  #hud{position:absolute;inset:0;pointer-events:none;color:#fff;text-shadow:1px 1px 2px #000;}
  #pop{position:absolute;top:40px;right:52px;font-size:22px;letter-spacing:2px;}
  #tries{position:absolute;bottom:55px;left:51px;font-size:18px;}
  .bar{position:absolute;bottom:31px;left:22px;width:12px;height:150px;background:#00000044;border:1px solid #234;}
  .bar .fill{position:absolute;bottom:0;left:0;right:0;background:#e34545;}
  .bar .top{position:absolute;top:-10px;left:-4px;right:-4px;height:6px;background:#ffd700;display:none;}
  #combo{position:absolute;top:50px;left:50%;transform:translateX(-50%);font-size:20px;color:#ffd700;display:none;}
  #btns{position:absolute;top:14px;right:14px;pointer-events:auto;}
  #btns span{display:block;margin:6px 0;padding:2px 6px;background:#00000066;border-radius:4px;cursor:pointer;font-size:15px;}
  #msg{position:absolute;top:40%;width:100%;text-align:center;font-size:40px;font-weight:bold;display:none;}
  #city{position:absolute;inset:0;background:url('./assets/flash/city_spr_640.png') center/cover;display:none;}
  /* 坐标对号: 网格原点 = (320+CITY_MAP_X, 240+CITY_MAP_Y) = (224,107), 格 52px (Const.CITY_MAP_*) */
  #cityHead{position:absolute;top:40px;left:145px;width:335px;height:34px;font-size:14px;color:#234;}
  #cityLevel{position:absolute;left:6px;top:8px;font-weight:bold;}
  #cityPop{position:absolute;right:14px;top:8px;font-weight:bold;}
  #cityProgressBar{position:absolute;top:34px;left:2px;width:338px;height:6px;background:#00000033;}
  #cityProgressFill{height:100%;background:#f80;width:0;}
  #cityStatus{position:absolute;top:30px;left:110px;right:10px;font-size:12px;color:#7a2020;z-index:3;}
  #cityGrid{position:absolute;left:224px;top:107px;display:grid;grid-template-columns:repeat(5,52px);
    grid-template-rows:repeat(5,52px);cursor:pointer;}
  #cityGrid .cell{position:relative;}
  #cityGrid .cell.ok{outline:2px solid #ffd700;background:#ffd70022;}
  #cityGrid .tower{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:36px;
    display:flex;align-items:flex-end;justify-content:center;font-size:9px;color:#fff;text-shadow:1px 1px 1px #000;}
  /* 塔型选择器/dozer 对齐原版左侧面板 (menu_spr 布局, CityMap.showMenu/showTowerSelections) */
  #cityMenu{position:absolute;left:156px;top:102px;display:flex;flex-direction:column;gap:10px;}
  #cityMenu .sel{width:60px;height:44px;border:2px solid transparent;border-radius:4px;
    cursor:pointer;text-align:center;font-size:10px;color:#234;position:relative;}
  #cityMenu .sel .sw{width:30px;height:14px;margin:4px auto 0;border-radius:2px;}
  #cityMenu .sel.locked{opacity:.35;cursor:default;}
  #cityMenu .sel.active{border-color:#e33;}
  #cityMenu .sel.dozer{margin-top:14px;background:#e8e0c8;}
  #cityHint{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:12px;color:#234;opacity:.85;}
  #hint{position:absolute;bottom:8px;width:100%;text-align:center;font-size:13px;opacity:.7;}
</style>
<script>window.__errs=[];addEventListener('error',e=>__errs.push(e.message+' @ '+e.filename+':'+e.lineno));addEventListener('unhandledrejection',e=>__errs.push('rej: '+e.reason));</script>
<script type="importmap">
{ "imports": {
    "three": "./js/three.module.js",
    "three/addons/": "./js/"
} }
</script>
</head>
<body>
<div id="stage">
  <div id="hud">
    <div class="bar" id="progress"><div class="fill"></div><div class="top"></div></div>
    <div id="tries">♥♥♥</div>
    <div id="pop">00000</div>
    <div id="combo">5 x1</div>
    <div id="btns"><span id="btnMusic">♪</span><span id="btnSound">🔊</span><span id="btnExit">✕</span></div>
    <div id="msg"></div>
    <div id="hint">点击 / 空格 放下积木 · 还原自原版 Tower Bloxx（J2ME 3D 资产）</div>
  </div>
  <div id="city">
    <div id="cityHead">
      <span id="cityLevel">0/20</span>
      <span id="cityPop">0</span>
      <div id="cityProgressBar"><div id="cityProgressFill"></div></div>
    </div>
    <div id="cityStatus"></div>
    <div id="cityGrid"></div>
    <div id="cityMenu"></div>
    <div id="cityHint"></div>
  </div>
</div>
<script type="module" src="./game.js"></script>
</body>
</html>
