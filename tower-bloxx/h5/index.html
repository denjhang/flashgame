<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Tower Bloxx 3D — H5 (原版 J2ME 资产)</title>
<style>
  html,body{margin:0;height:100%;background:#20222e;display:flex;align-items:center;justify-content:center;font-family:"Segoe UI",sans-serif;}
  body{margin:0;height:100vh;display:flex;justify-content:center;align-items:center;background:#202020;}
  /* FluidLayout 对号: Stage.scaleMode=noscale + align=C → 舞台恒居中 (FluidLayout.as:9-11,29-33) */
  #stage{position:relative;width:640px;height:480px;box-shadow:0 0 40px #000;
    background:linear-gradient(#1a2430,#101018);}  /* 两侧留边: 游戏区=居中360x480 (J2ME 240x320 x1.5) */
  .j2scr{position:absolute;left:140px;top:0;width:360px;height:480px;overflow:hidden;}  /* J2ME 240x320 ×1.5 */
  canvas{display:block;}
  #hud{position:absolute;inset:0;pointer-events:none;color:#fff;text-shadow:1px 1px 2px #000;}
  #pop{position:absolute;top:40px;right:52px;font-size:22px;letter-spacing:2px;}
  #tries{position:absolute;left:191px;bottom:31px;font-size:0;}  /* j(): 机会竖条 左下 cn+cn/2+14 */
  #tries img{width:43px;height:52px;}
  #pop{position:absolute;left:482px;bottom:34px;width:97px;height:26px;font-size:0;}  /* j(): 人口 右下 E-cn */
  #popDigits{position:absolute;left:20px;top:0;width:78px;height:26px;line-height:26px;text-align:center;font:bold 15px monospace;color:#fff;letter-spacing:1px;}
  #combo{position:absolute;top:50px;left:calc(50% - 136px);width:272px;height:52px;font-size:0;display:none;}
  #combo img{position:absolute;inset:0;width:272px;height:52px;}
  #comboFill{position:absolute;left:36px;top:18px;height:14px;width:0;background:#ffd24a;}
  #comboText{position:absolute;left:196px;top:12px;width:70px;height:18px;font:bold 16px monospace;color:#ffe27a;background:#181200;line-height:18px;text-align:center;}
  #progress{display:none;}  /* Flash 黑进度柱退役 (AL+1) */
  #progress img{width:47px;height:232px;}
  #barBlack{position:absolute;left:17px;bottom:4px;width:12px;height:0;background:#000;}
  #barTop{position:absolute;left:8px;width:30px;height:14px;font-size:11px;color:#ffd700;display:none;}
  #combo{position:absolute;top:31px;left:230px;width:180px;font-size:18px;color:#ffff00;display:none;text-align:center;}  /* j(): 组合计时器 顶中 co */
  #btns{position:absolute;inset:0;pointer-events:none;font-size:0;}
  #btns img{position:absolute;pointer-events:auto;cursor:pointer;}
  #btns span{display:block;margin:6px 0;padding:2px 6px;background:#00000066;border-radius:4px;cursor:pointer;font-size:15px;}
  #msg{position:absolute;top:40%;left:140px;width:360px;text-align:center;font-size:32px;font-weight:bold;display:none;
  -webkit-text-stroke:2px #000;} /* msg_spr(362)+msg_stroke(360): 白字黑描边双层 (导出帧为黑底容器, 样式实证) */
  /* 结算/提示弹窗面板 (GameSprites.showSummary/showTip 共用 popupSpr 语义) */
  /* popup_spr(462)/confirmation_reset(444) 绿色面板, 原版 popupSpr CTR 0,40 → (320,280) (读图 433x219) */
  #summary{position:absolute;left:104px;top:170px;width:433px;height:219px;font-size:14px;color:#14501e;
    display:none;text-align:center;z-index:9;padding:26px 30px;box-sizing:border-box;overflow:auto;line-height:1.45;
    background:url('./assets/flash/fx/DefineSprite_462_popup_spr/1.png') center/433px 219px no-repeat;}
  #summary.reset{background-image:url('./assets/flash/fx/DefineSprite_444_confirmation_reset_spr/1.png');}
  #summary .t{font-size:20px;font-weight:bold;margin-bottom:8px;}
  #summary .ok{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);padding:4px 16px;
    background:#2a6b2a;border-radius:6px;color:#fff;cursor:pointer;display:inline-block;}
  #city{position:absolute;inset:0;background:url('./assets/flash/city_spr_640.png') center/cover;display:none;}
  /* 坐标对号: 网格原点 = (320+CITY_MAP_X, 240+CITY_MAP_Y) = (224,107), 格 52px (Const.CITY_MAP_*) */
  #cityHead{position:absolute;top:40px;left:145px;width:335px;height:34px;font-size:14px;color:#234;}
  #cityLevel{position:absolute;left:6px;top:8px;font-weight:bold;}
  #cityPop{position:absolute;right:14px;top:8px;font-weight:bold;}
  #cityProgressBar{position:absolute;top:34px;left:2px;width:338px;height:6px;background:#00000033;}
  #cityProgressFill{height:100%;background:#f80;width:0;}
  /* cityStatus 落在原版白色消息框内 (读图实测: x146-493, y391-445) */
  #cityStatus{position:absolute;top:395px;left:150px;width:340px;height:46px;font-size:12px;
    color:#333;display:flex;align-items:center;justify-content:center;text-align:center;z-index:3;}
  #cityGrid{position:absolute;left:224px;top:107px;display:grid;grid-template-columns:repeat(5,52px);
    grid-template-rows:repeat(5,52px);cursor:pointer;}
  #cityGrid .cell{position:relative;}
  /* 可建格高亮=原版 774 黄框 (读图 47x47, 52 格内居中 inset≈2px) — updateCellHighlights:514-539 */
  #cityGrid .cell.ok::after{content:'';position:absolute;left:2px;top:2px;width:47px;height:47px;
    background:url('./assets/flash/fx/DefineSprite_774_city_place_highlight_spr/1.png') center/47px 47px no-repeat;}
  #cityGrid .tower{position:absolute;left:10px;bottom:13px;width:50px;height:50px;pointer-events:none;}
  /* 选择列读图实测: 图标行 y=109/157/205/253 (节距48, 高约44), x≈155-210; dozer y=302-362 */
  #cityMenu{position:absolute;left:152px;top:105px;display:flex;flex-direction:column;gap:4px;}
  #cityMenu .sel{width:60px;height:44px;border:2px solid transparent;border-radius:4px;
    cursor:pointer;text-align:center;font-size:10px;line-height:40px;color:#134;position:relative;}
  #cityMenu .sel .sw{display:none;} /* 图标已在底图中, 叠加层只留文字标签与选中框 */
  #cityMenu .sel.locked{cursor:default;}
  #cityMenu .sel.locked::after{content:'';position:absolute;inset:0;background:#ffffffcc;border-radius:4px;}
  #cityMenu .sel.active{border-color:#e33;}
  #cityMenu .sel.dozer{margin-top:5px;}
  #cityHint{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:12px;color:#234;opacity:.85;}
  #hint{position:absolute;bottom:8px;width:100%;text-align:center;font-size:13px;opacity:.7;}
  /* 菜单流: 467 title / 473 menu 底图 (读图 648x480 与 640x480, cover 铺满) */
  #titleScr{position:absolute;inset:0;display:none;cursor:pointer;background:#9acc2a;}
  #splashScr{z-index:20;position:absolute;inset:0;display:none;cursor:default;background:#fff;}
    #menuScr{position:absolute;inset:0;display:none;background:#9acc2a;}
  /* i.b(Graphics): 文字行菜单 — 选中行黄条 0xFFDD46, 文字黑 0x010101 */
  .mrow{position:relative;margin:0;padding:5px 0;text-align:center;font-size:19px;color:#010101;cursor:pointer;}
  .mrow.sel{background:#ffdd46;}
  .mrow:hover{background:#ffe98a;}
  #menuSub{position:absolute;inset:0;display:none;background:#000000d0;color:#fff;
    font-size:14px;padding:40px 24px;overflow:auto;}
</style>
<script>window.__errs=[];addEventListener('error',e=>__errs.push(e.message+' @ '+e.filename+':'+e.lineno));addEventListener('unhandledrejection',e=>__errs.push('rej: '+e.reason));</script>
<script type="importmap">
{ "imports": {
    "three": "./js/three.module.js",
    "three/addons/": "./js/"
} }
</script>
</head>
<body>
<div id="stage">
  <div id="hud">
    <div id="progress"><img id="progressImg"><div id="barBlack"></div><div id="barTop">GO</div></div>
    <div id="tries"><img id="triesImg"></div>
    <div id="pop"><img src="./assets/flash/fx/DefineSprite_303_population_spr/1.png"><div id="popDigits">00000</div></div>
    <div id="combo"><img src="./assets/flash/fx/DefineSprite_275_combo_spr/1.png"><div id="comboFill"></div><div id="comboText">5 x1</div></div>
    <!-- menu_btn_spr 帧 12/11/9 裁切 (bbox 实测 71x28/79x26); 坐标=makeGameButton 中心 594,20/50/80 -->
    <div id="btns">
      <img id="btnMusic" src="./assets/flash/fx/btn12.png" style="left:558px;top:6px" alt="music">
      <img id="btnSound" src="./assets/flash/fx/btn11.png" style="left:558px;top:36px" alt="sound">
      <img id="btnExit" src="./assets/flash/fx/btn9.png" style="left:554px;top:67px" alt="exit">
    </div>
    <div id="msg"></div>
  <div id="summary"></div>
    <div id="hint">点击 / 空格 放下积木 · 还原自原版 Tower Bloxx（J2ME 3D 资产）</div>
  </div>
  <div id="splashScr"></div>
  <div id="titleScr"></div>
  <div id="menuScr">
    <!-- menu_btn_spr(552) 帧=BTN 常量(Const.as:6-16); 坐标=makeMenuSprites:342-350 中心点, 尺寸读图 299x67 -->
    <div class="j2scr" id="menuArt">
      <img src="./assets/j2me_cloud_s.png" style="position:absolute;left:15px;top:60px">
      <img src="./assets/j2me_cloud_b.png" style="position:absolute;left:240px;top:90px">
      <img src="./assets/j2me_balloon.png" style="position:absolute;left:50%;top:110px;transform:translateX(-50%);width:300px">
      <div style="position:absolute;left:0;right:0;top:16px;text-align:center;font-size:26px;color:#123;font-weight:bold;letter-spacing:6px">都市摩天楼</div>
      <div style="position:absolute;left:90px;top:255px;width:180px" id="menuList">
        <div class="mrow" id="mQuick">快速游戏</div>
        <div class="mrow" id="mBuild">建造城市</div>
        <div class="mrow" id="mHS">最高分</div>
        <div class="mrow" id="mInstr">游戏规则说明</div>
        <div class="mrow" id="mMidi">音乐: 关</div>
        <div class="mrow" id="mReset">重新设定城市</div>
      </div>
    </div>
    <div id="menuSub"></div>
  </div>
  <div id="city">
    <div id="cityHead">
      <span id="cityLevel">0/20</span>
      <span id="cityPop">0</span>
      <div id="cityProgressBar"><div id="cityProgressFill"></div></div>
    </div>
    <div id="cityStatus"></div>
    <div id="cityGrid"></div>
    <div id="cityMenu"></div>
    <div id="cityHint"></div>
  </div>
</div>
<script type="module" src="./game.js"></script>
</body>
</html>
