<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>领土防御 Territory Defense</title>
<style>
  html, body { height:100%; }
  body { background:#000; margin:0; display:flex; align-items:center; justify-content:center;
         font-family:monospace; user-select:none; overflow:hidden; }

  /* 缩放容器: 舞台(地图+侧栏) + 底部 HUD; 宽高与 transform 由 fitStage() 动态设置 */
  #fit { position:relative; transform-origin:center center; flex:none; }

  /* 舞台: 地图区 (宽度动态, 由 fitStage 设 canvas.width) + 右侧栏 165 */
  /* 底色 = 原版 SWF 舞台背景色 #441100 (canvas 未覆盖处与原版一致) */
  #stage { position:relative; background:#441100; overflow:hidden; }
  #cv { position:absolute; left:0; top:0; cursor:crosshair; }
  /* 原版右侧栏 = DefineSprite_1079 底板直出 (170x602, FFDec 字节级)。
     子区坐标 = 1079 PNG 像素测量 (x-85 归零): 小地图 (2,11)163x150,
     标题条 y175(h23, 已烤入), 槽位 2x2 @ (9,201)(86,201)(9,265)(86,265) 75x62,
     INFO 条 y332 (INFO 标签/◀▶ 已烤入), 信息框 (1,360)166x136, 底栏 y543..601。
     动态控件绝对定位覆盖其上; 1026 按钮态 = cxform 变体: lock 乘 0x68(≈0.41) */
  #side { position:absolute; right:0; top:0; width:170px; height:600px;
          background:url('assets/ui/sidebar.png') no-repeat; display:block; overflow:visible; }
  #minimapBox { position:absolute; left:2px; top:11px; width:163px; height:150px; }
  #minimap { display:block; cursor:pointer; width:163px; height:150px; }
  /* 标题条/INFO 标签已烤入底图 → 文本透明, 元素仅占位/供 JS 写页码 */
  .panelTitle { background:transparent; color:transparent; text-align:center; font-weight:bold;
                font-size:11px; padding:3px 0; letter-spacing:1px; }
  #shopTitle { position:absolute; left:0; top:175px; width:170px; height:23px; line-height:23px; padding:0; }
  #shop { position:absolute; left:9px; top:201px; width:152px; display:grid;
          grid-template-columns:75px 75px; gap:2px; padding:0; background:transparent; }
  .sel { cursor:pointer; position:relative; width:75px; height:62px; background:#000; }
  .sel img { width:75px; height:62px; display:block; }
  .sel:hover { filter:brightness(1.25) saturate(1.15); }
  .sel.on { outline:2px solid #e80; outline-offset:-2px; }
  .sel.lock { filter:brightness(0.41); }
  .sel.lock:hover { filter:brightness(0.41); cursor:not-allowed; }
  .sel .price { position:absolute; left:0; right:0; top:0; bottom:0; display:flex; align-items:center;
             justify-content:center; background:rgba(0,0,0,.55); color:#fc6; font-size:10px; }
  /* INFO 条 y332 h27: 标签已烤入; ◀▶ 原版 1078 位置 = 底图 (65,335)(116,335) 45x23 */
  .panelHead { position:absolute; left:0; top:332px; width:166px; height:27px; }
  .panelHead .panelTitle { position:absolute; left:4px; top:3px; width:58px; height:23px; padding:0; line-height:20px; }
  .panelHead .arrow { position:absolute; top:3px; background:transparent; color:transparent; width:45px;
                      height:23px; cursor:pointer; padding:0; border:none; user-select:none; }
  .panelHead .arrow:active { background:rgba(255,255,255,.15); }
  #pageL { left:65px; }
  #pageR { left:116px; }
  /* 页码点 (3 页, H5 附加; 原版无, 置于 INFO 条下方不遮挡) */
  #pageDots { position:absolute; left:0; top:359px; width:166px; display:flex; gap:3px;
              justify-content:center; padding:0; background:transparent; }
  #pageDots i { width:5px; height:4px; border-radius:0; background:#666; display:block; }
  #pageDots i.on { background:#e80; }
  #infoBox { position:absolute; left:1px; top:363px; width:166px; height:132px;
             background:transparent; color:#ccccdd; font-size:10.5px; line-height:1.35;
             padding:2px 4px; overflow:hidden; box-sizing:border-box; }
  #infoBox b { color:#e8e8ff; }
  #lossBox { position:absolute; left:1px; top:589px; width:166px; height:11px;
             background:transparent; padding:0 5px; font-size:9px; line-height:11px; box-sizing:border-box; }
  #lossBox .losses { color:#daa; }
  #lossBox .cash { color:#ee8; }
  #lossBox .interest { color:#aa8; font-size:9px; }
  /* 原版开关按钮本体 (#4, N+73): 1058/1063/1068/1073 直出 247x23 → 缩放 166x23,
     竖排 23px 行距 (= informations 内 menuZoom/menuHealth/menuArea 行距) */
  .artBtn { position:absolute; left:2px; width:166px; height:23px; border:none; padding:0;
            background-repeat:no-repeat; background-size:166px 23px; background-color:transparent;
            cursor:pointer; }
  .artBtn:hover { filter:brightness(1.35); }
  .artBtn.on { outline:1px solid #e80; outline-offset:-1px; }
  #tZoom   { top:496px; background-image:url('assets/ui/btn_zoom.png'); }
  #tHp     { top:519px; background-image:url('assets/ui/btn_health.png'); }
  #tArea   { top:542px; background-image:url('assets/ui/btn_area.png'); }
  #tScroll { top:565px; background-image:url('assets/ui/btn_scroll.png'); }
  /* 音乐面板开关: 小 ♪ 置于标题条右端 (原版无此钮, 面板由 UI 容器显隐) */
  #mOpen { position:absolute; left:152px; top:176px; width:16px; height:20px; padding:0;
           background:transparent; border:none; color:#ddd; font-size:12px; cursor:pointer; }
  #mOpen:hover { color:#ff8; }
  /* 音乐/开关面板 — 原版 DefineSprite_1151 全景图 (178x203) + 原位热区。
     权威 = FFDec SVG: 1145 歌曲按钮 109.65x21.05 @ (6.85, 7.05/34.65/61.7),
     pauser @ (7.15, 91.5), 关闭钮 686 @ (144.8, 3.05) 26.75x26.75 */
  #musicBox { position:absolute; left:0; top:0; width:0; height:0; background:transparent; }
  /* 1151 面板为弹出层 (原版盖在地图上): 向左弹出侧栏 */
  #musicPanel { position:absolute; right:172px; top:0; width:178px; height:203px;
                font-family:monospace; display:none; }
  #musicPanel.show { display:block; }
  #musicPanelImg { position:absolute; left:0; top:0; }
  .mpBtn { position:absolute; cursor:pointer; font-size:11px; line-height:21px; padding-left:5px;
           white-space:nowrap; overflow:hidden; background:#030303; color:#8a8a8a; }
  .mpBtn:hover { color:#fff; }
  .mpBtn.pauser { background:#616161; color:#ddd; }
  .mpBtn.close { background:transparent; }
  /* 波间二选一面板 (原版 sprite 989 debloquerArme, 舞台居中 _x=400 _y=300) */
  #unlockPanel { position:absolute; left:400px; top:300px; transform:translate(-50%,-50%);
                 width:300px; background:#3a3a3a; border:3px solid #888;
                 box-shadow:0 0 0 3px #111, 0 6px 22px rgba(0,0,0,.7);
                 display:none; z-index:50; padding:10px; }
  #unlockPanel.show { display:block; }
  #upInfo { background:#101010; color:#cfc; font-size:12px; line-height:1.5;
            padding:8px; margin-bottom:8px; white-space:pre-line; text-align:center;
            border:1px solid #555; }
  #unlockPanel .btns { display:flex; flex-direction:column; gap:6px; }
  #unlockPanel button { background:#5a5a3a; color:#ffe; border:2px solid #999;
                        font-family:monospace; font-size:12px; padding:7px; cursor:pointer; }
  #unlockPanel button:hover:not(:disabled) { border-color:#e80; background:#6a6a4a; }
  /* 原版 953 出兵条 (1106/1176): 125x35 黑条, 舞台 y=400 水平居中; 两种状态都可点击
     (1106 on press 开波 / 1176 on press 跳过倒计时开波) */
  #briefBar { position:absolute; left:50%; top:400px; transform:translateX(-50%);
              display:none; z-index:28; cursor:pointer; }
  #briefBar img { display:block; width:125px; height:35px; image-rendering:auto; }
  #unlockPanel button:disabled { opacity:.35; cursor:not-allowed; }
  #unlockPanel button.int { background:#3a4a5a; }
  #unlockPanel button.int:hover:not(:disabled) { background:#4a5a6a; }
  /* 底部 HUD: 宽度跟随舞台 (由 fitStage 设为 W+165) */
  #hud { position:absolute; left:0; top:600px; width:100%; color:#cfc; font-size:12px;
         padding:2px 6px; box-sizing:border-box; background:#000; }
  #hud .hint { color:#9aa; font-size:11px; }
</style>
</head>
<body>
<div id="fit">
  <div id="stage">
    <canvas id="cv" width="635" height="600"></canvas>
    <div id="side">
      <div id="minimapBox"><canvas id="minimap" width="161" height="150"></canvas></div>
      <div class="panelTitle" id="shopTitle">UNIT / BUILD MENU</div>
      <div id="shop"></div>
      <div id="pageDots"><i></i><i></i><i></i></div>
      <div class="panelHead">
        <div class="arrow" id="pageL" title="上一页">◀</div>
        <div class="panelTitle">INFO</div>
        <div class="arrow" id="pageR" title="下一页">▶</div>
      </div>
      <div id="infoBox">点选炮塔查看属性</div>
      <!-- 原版开关按钮本体 (1058 change zoom / 1063 health on/off / 1068 build areas /
           1073 mouse scroll, 247x23 直出缩放 166x23, 竖排 = informations 行距 23) -->
      <button class="artBtn" id="tZoom" title="全图 G"></button>
      <button class="artBtn" id="tHp" title="血条 H"></button>
      <button class="artBtn" id="tArea" title="建区 C"></button>
      <button class="artBtn" id="tScroll" title="滚屏 M"></button>
      <button id="mOpen" title="音乐面板">♪</button>
      <div id="musicBox">
        <div id="musicPanel">
          <img id="musicPanelImg" src="assets/ui/music_panel.png" width="178" height="203" alt="">
          <div class="mpBtn" id="m0" style="left:7px;top:7px;width:105px;height:21px"></div>
          <div class="mpBtn" id="m1" style="left:7px;top:35px;width:105px;height:21px"></div>
          <div class="mpBtn" id="m2" style="left:7px;top:62px;width:105px;height:21px"></div>
          <div class="mpBtn pauser" id="mPlay" style="left:7px;top:92px;width:105px;height:21px"></div>
          <div class="mpBtn close" id="mMute" style="left:145px;top:3px;width:27px;height:27px" title="关闭"></div>
        </div>
      </div>
      <div id="lossBox">
        <span class="losses" id="hLoss">LOSSES 0</span>
        <span class="cash" id="hCash"></span>
        <span class="interest" id="hInt2"></span>
      </div>
    </div>
    <div id="unlockPanel">
      <div id="upInfo"></div>
      <div class="btns">
        <button id="upUnlock">解锁下一件武器</button>
        <button id="upInterest" class="int">提高利率</button>
      </div>
    </div>
    <!-- 原版 953 出兵条: 简报波 = chid1106 "start mission" 按钮 (on press → startMission);
         其余波 = chid1176 "start in 8..1" 倒计时 (953 f47..f166 每 17帧@24fps 跳一格) -->
    <div id="briefBar"><img id="briefImg" alt="" width="125" height="35"></div>
  </div>
  <div id="hud">
    金钱 <b id="hEuros"></b> | 波次 <b id="hWave"></b>/44 | 分数 <b id="hScore"></b> (丢塔数) |
    <span class="hint">方向键/鼠标边缘滚动 · 小地图点击跳转 · 空格取消 · 点塔选中 → S卖/R修/T自动修理/U对空 · ◀▶ 翻页</span>
  </div>
</div>
<script src="data.js?v=1790600043"></script>
<script src="game.js?v=1790600043"></script>
</body>
</html>
